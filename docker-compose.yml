name: bandwidth-optimization

services:
  bwopt:
    build: .
    image: bandwidth-optimization:dev
    volumes:
      - .:/src
    working_dir: /src
    cap_add:
      - NET_ADMIN
    command: make test

  demo:
    image: bandwidth-optimization:dev
    volumes:
      - .:/src
    working_dir: /src
    cap_add:
      - NET_ADMIN
    command: bash scripts/demo.sh

networks:
  default:
    ipam:
      config:
        - subnet: 172.43.0.0/24
