# Bandwidth Optimization Engine - QoS Policies
# Network Administrator - Etech Eritrea PLC (2013)

[global]
interface=eth0
total_bandwidth=100000000  # 100 Mbps
default_class=best_effort

[classes]
# High Priority: VoIP, Video Conferencing
high_priority.bandwidth=30%
high_priority.dscp=46
high_priority.burst=32k

# Medium Priority: Business Applications
medium_priority.bandwidth=40%
medium_priority.dscp=34
medium_priority.burst=64k

# Low Priority: Web Browsing, Email
low_priority.bandwidth=20%
low_priority.dscp=18
low_priority.burst=128k

# Best Effort: Everything else
best_effort.bandwidth=10%
best_effort.dscp=0
best_effort.burst=256k

[applications]
# VoIP Traffic
sip.port=5060
sip.class=high_priority
rtp.port_range=10000-20000
rtp.class=high_priority

# Video Conferencing
h323.port=1720
h323.class=high_priority

# Business Applications
ssh.port=22
ssh.class=medium_priority
https.port=443
https.class=medium_priority
smtp.port=25
smtp.class=medium_priority

# Web Traffic
http.port=80
http.class=low_priority
ftp.port=21
ftp.class=low_priority

[monitoring]
update_interval=30
log_file=/var/log/bandwidth_optimizer.log
database=/var/lib/bandwidth_optimizer/metrics.db