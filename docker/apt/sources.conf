# Package sources for the image build. Every index and package is fetched
# over HTTPS from snapshot.debian.org and verified by docker/apt/fetch-debs.sh.
# Columns: name, archive base URL, dists path, expected Codename in Release.
#
# wheezy-main / wheezy-security: the final wheezy (7.11) archive state, which
# matches the libc6 already present in the debian:wheezy base image.
# jessie-main: Debian testing as published on 2013-09-30, used only for the
# gcc 4.8 AddressSanitizer toolchain in /opt/asan.
wheezy-main      https://snapshot.debian.org/archive/debian/20190301T000000Z           wheezy          wheezy
wheezy-security  https://snapshot.debian.org/archive/debian-security/20190301T000000Z  wheezy/updates  wheezy
jessie-main      https://snapshot.debian.org/archive/debian/20130930T000000Z           jessie          jessie
